# Blueprint do Render — alternativa à Vercel (ver README).
# Sobe um serviço único: a API serve o site compilado.
# Use "New + → Blueprint" no painel do Render e aponte para este repositório.
services:
  - type: web
    name: treinos
    runtime: node
    plan: free
    buildCommand: ./deploy/render-build.sh
    # A própria API serve o site compilado (frontend/dist), então é um serviço só
    startCommand: cd backend && node dist/server.js
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      # Aponte para um PostgreSQL gratuito e sem prazo (Neon ou Supabase).
      # Configure o valor no painel do Render, em Environment.
      - key: DATABASE_URL
        sync: false
      # Conexão direta do mesmo banco (sem o pool), usada para criar as tabelas
      - key: DIRECT_URL
        sync: false
      # Segredos gerados pelo Render — nunca ficam no repositório
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # APP_URL e CORS_ORIGINS usam a URL pública do serviço automaticamente
      # (RENDER_EXTERNAL_URL); defina aqui apenas se usar domínio próprio.
      - key: MAIL_FROM
        value: Treinos <nao-responda@treinos.app>
